[project]
name = "ha-mail-home-assistant"
version = "0.1.1"
description = "Home Assistant adapter for Mail"
requires-python = ">=3.14.2"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant==2026.11.0",
  "aiohasupervisor==0.10.0",
  "playwright==1.64.1",
  "ruff==0.17.4",
  "ty==0.0.99",
  "pyyaml==6.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests_ha"]
addopts = "--strict-markers -p no:respx"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "ANN"]

[tool.uv]
package = false
