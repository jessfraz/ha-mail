<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><base href="__MAIL_BASE__"><title>Mail</title><link rel="icon" href="brand.svg" type="image/svg+xml"><link rel="stylesheet" href="app-kit.css"><link rel="stylesheet" href="style.css"><script src="app.js" type="module"></script></head>
<body>
<header class="app-header"><span id="app-brand" hidden><img src="brand.svg" width="30" height="30" alt=""></span><button id="refresh" type="button" hidden>Refresh</button></header>
<main>
  <p id="notice" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p>
  <form id="login" hidden><h1>Connect</h1><p class="muted">The API token stays in this tab’s memory.</p><label for="token">API token</label><input id="token" type="password" autocomplete="off" required><button type="submit">Connect</button></form>
  <div id="app" hidden>
    <nav class="view-switch" aria-label="Mail views"><button id="mail-tab" type="button" aria-pressed="true">Mail</button><button id="settings-tab" type="button" aria-pressed="false">Settings</button></nav>
    <section id="mail-view" aria-labelledby="mail-heading"><div class="page-heading"><h1 id="mail-heading">Mailbox</h1><p id="counts" class="muted" role="status"></p></div>
      <form id="filters" class="filters" role="search"><label for="search">Sender or summary<input id="search" type="search" maxlength="200"></label><label for="scan-status">Scan<select id="scan-status"><option value="">All</option><option value="none">Not requested</option><option value="processing">Scanning</option><option value="completed">Scan ready</option></select></label><label class="checkbox"><input id="unread" type="checkbox">Unread only</label><label class="checkbox"><input id="archived" type="checkbox">Archived mail</label><button type="submit" class="quiet">Search</button></form>
      <p id="empty" class="empty" hidden>No mail matches these filters.</p><div id="items" class="mail-grid"></div><button id="load-more" class="quiet" type="button" hidden>Load more</button>
    </section>
    <section id="settings-view" aria-labelledby="settings-heading" hidden><div class="page-heading"><h1 id="settings-heading">Settings</h1></div><h2>Mailbox</h2><p><span id="environment" class="environment-badge"></span></p><p id="binding" class="muted"></p><form id="location-form" hidden><label for="location">Stable location</label><select id="location" required><option value="">Choose a location</option></select><button id="more-locations" type="button" class="quiet" hidden>Load more locations</button><p class="muted">This binds the database to the selected mailbox. It cannot be changed in place.</p><button type="submit">Use this mailbox</button></form><h2>Synchronization</h2><p id="sync-status"></p><button id="sync" type="button">Sync now</button><p class="muted">Scans and physical-mail actions are managed in Stable. Mail only reads their status.</p></section>
  </div>
</main>
<footer class="app-footer" id="app-footer" hidden></footer>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-heading"><h2 id="detail-title"></h2><button id="close-detail" class="quiet" type="button" aria-label="Close mail details">Close</button></div><p id="detail-error" role="alert" hidden></p><div id="detail-content"></div></dialog>
</body></html>
