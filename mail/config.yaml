name: Mail
version: "0.1.4"
slug: mail
description: Physical mail, envelope images, scans, and storage deadlines
url: https://github.com/jessfraz/ha-mail
arch: [amd64, aarch64]
image: ghcr.io/jessfraz/ha-mail
startup: application
boot: auto
backup: cold
init: false
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:mailbox-outline
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Bearer-authenticated API
options:
  stable_api_key: ""
  location_id: ""
  environment: production
  poll_seconds: 300
schema:
  stable_api_key: password
  location_id: str?
  environment: list(production|sandbox)
  poll_seconds: int(60,86400)
discovery: [ha_mail]
