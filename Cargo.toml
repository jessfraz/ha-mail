[package]
name = "ha-mail"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "A location-bound physical mailbox for Home Assistant"
repository = "https://github.com/jessfraz/ha-mail"
default-run = "mail"

[[bin]]
name = "mail"
path = "src/main.rs"

[[bin]]
name = "ha-mail"
path = "src/bin/ha-mail.rs"

[dependencies]
ha-app-ui = { git = "https://github.com/jessfraz/ha-app-kit", tag = "v0.1.4" }
ha-app-kit-ha = { git = "https://github.com/jessfraz/ha-app-kit", tag = "v0.1.4" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dropshot = "0.18"
getrandom = "0.4"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = { version = "0.8", features = ["uuid1", "chrono"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
slog = "2"
sqlx = { version = "0.9", git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3"
