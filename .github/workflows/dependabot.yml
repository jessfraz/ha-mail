name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  enable:
    if: >-
      github.repository == 'jessfraz/ha-mail' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No checkout or pull-request code runs with this token.
      - name: Merge after the required checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/$DEFAULT_BRANCH" |
            jq --exit-status 'any(.[];
              .type == "required_status_checks" and
              .parameters.strict_required_status_checks_policy == true and
              (.parameters.required_status_checks | length) > 0
            )' >/dev/null
          gh pr merge --auto --squash "$PR_URL"
